version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: multiple_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botdb}
      POSTGRES_USER: ${POSTGRES_USER:-botuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisSecureDbPassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botuser} -d ${POSTGRES_DB:-botdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot_net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multiple_bot_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_net

volumes:
  postgres_data:
    name: multiple_bot_postgres_data

networks:
  bot_net:
    driver: bridge
